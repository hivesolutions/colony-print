name: Windows Workflow
on:
  push:
  workflow_dispatch:
jobs:
  build:
    name: Build Node Installer
    timeout-minutes: 30
    runs-on: windows-latest
    env:
      PYTHON_VERSION: "3.14"
      INNO_SETUP_VERSION: "6.7.3"
      INNO_SETUP_SHA256: "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - name: Install Inno Setup
        run: |
          $Version = $env:INNO_SETUP_VERSION
          $Url = "https://github.com/jrsoftware/issrc/releases/download/is-$($Version.Replace('.', '_'))/innosetup-$Version.exe"
          Invoke-WebRequest -Uri $Url -OutFile innosetup.exe
          $Hash = (Get-FileHash -Path innosetup.exe -Algorithm SHA256).Hash.ToLower()
          if ($Hash -ne $env:INNO_SETUP_SHA256) { throw "Invalid Inno Setup digest $Hash" }
          Start-Process -Wait -FilePath .\innosetup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=C:\InnoSetup"
          Remove-Item innosetup.exe
      - name: Build installer
        run: .\windows\build.ps1 -Iscc C:\InnoSetup\ISCC.exe
      - name: Smoke test installer
        run: |
          python -m pip install . tinydb netius
          python windows\smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colony-print-node-windows
          path: |
            dist/*.exe
            dist/packages/*.whl
          if-no-files-found: ignore
