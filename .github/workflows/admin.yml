name: Admin Workflow
on:
  push:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontends/admin
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontends/admin/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --coverage
      - name: Build
        run: npm run build
